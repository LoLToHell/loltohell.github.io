  proxy-server-nameserver-policy: null
  direct-nameserver: null
  direct-nameserver-follow-policy: false
ntp:
  enable: false
  server: time.apple.com
  port: 123
  interval: 30
  dialer-proxy: ''
  write-to-system: false
tun:
  enable: true
  device: FlClash
  stack: mips
  dns-hijack:
  - any:53
  auto-route: true
  auto-detect-interface: true
  inet6-address:
